[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-strength-security-analyzer"
version = "1.0.0"
description = "A privacy-conscious cybersecurity tool that analyzes password strength using length, character diversity, pattern detection, common-password checks, policy evaluation, and theoretical entropy estimation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DecodeLabs Cyber Security Intern" }
]
keywords = ["cybersecurity", "password", "security", "entropy", "analyzer"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
cli = ["colorama>=0.4.6"]
breach = ["requests>=2.31"]
web = ["flask>=3.0"]

[project.scripts]
password-checker = "password_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
